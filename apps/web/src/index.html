<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rearview</title><style>body{font-family:system-ui;margin:0;display:grid;grid-template-columns:18rem 1fr 22rem;min-height:100vh}aside,main{padding:1rem;border-right:1px solid #ddd}.file{border:1px solid #ddd;margin:.75rem 0;padding:.75rem;border-radius:.5rem}pre{overflow:auto;background:#111;color:#eee;padding:1rem}.add{color:#9f9}.delete{color:#f99}@media(max-width:800px){body{display:block}}</style></head>
  <body><aside id="outline">Loading…</aside><main id="story"></main><aside id="context"><h2>Authoring</h2><p>Drag sections/files in a full client build; this local MVP exposes editable story metadata, author notes, and PR body export.</p><h2>Comment</h2><label>Intent <select id="intent"><option>issue</option><option>suggestion</option><option>question</option><option>praise</option><option>nit</option><option>blocker</option><option>note</option></select></label><label>Severity <select id="severity"><option>info</option><option>low</option><option>medium</option><option>high</option><option>blocking</option></select></label><textarea id="comment" placeholder="Add a structured review comment"></textarea><button id="draft">Draft locally</button><div id="drafts"></div></aside><script type="module">const story=await fetch('/api/story').then(r=>r.json());outline.innerHTML=`<h1>${story.title}</h1><p>${story.summary}</p>`+story.sections.map(s=>`<a href="#${s.id}">${s.title}</a><br>`).join('');storyEl=document.getElementById('story');storyEl.innerHTML=story.sections.map(s=>`<section id="${s.id}"><h2>${s.title}</h2><p>${s.purpose}</p><p>${s.guidance}</p>${s.files.map(f=>`<details class="file"><summary>${f.path} · ${f.risk}</summary>${f.hunks.map(h=>`<h4>${h.heading}</h4><pre>${h.lines.map(l=>`<span class="${l.kind}">${l.kind==='add'?'+':l.kind==='delete'?'-':' '} ${l.content.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</span>`).join('\n')}</pre>`).join('')}</details>`).join('')}</section>`).join('');document.getElementById('draft').onclick=()=>{const d=document.createElement('p');d.textContent=`${intent.value} · ${severity.value}: ${comment.value}`;drafts.append(d);comment.value='';};</script></body>
</html>
